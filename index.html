<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c2a25" />
<title>Yahtzee · Royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>

<!-- ===== START SCREEN ===== -->
<section class="screen screen--start" id="screenStart">
  <div class="brand">
    <div class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 80 80" width="64" height="64"><rect x="6" y="6" width="68" height="68" rx="14" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="26" cy="26" r="5" fill="currentColor"/><circle cx="54" cy="26" r="5" fill="currentColor"/><circle cx="40" cy="40" r="5" fill="currentColor"/><circle cx="26" cy="54" r="5" fill="currentColor"/><circle cx="54" cy="54" r="5" fill="currentColor"/></svg>
    </div>
    <h1 class="brand__title">Yahtzee<span>Royale</span></h1>
    <p class="brand__tag">Roll. Strategize. Win.</p>
  </div>

  <div class="card card--menu">
    <div class="menu">
      <button class="menu__btn" data-mode="local">
        <span class="menu__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4"/>
            <circle cx="8" cy="8" r="1.3" fill="currentColor"/>
            <circle cx="16" cy="16" r="1.3" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
          </svg>
        </span>
        <span class="menu__text"><b>Local Play</b><em>Pass-and-play · 2–8 players</em></span>
        <span class="menu__chev" aria-hidden="true">→</span>
      </button>
      <button class="menu__btn" data-mode="ai">
        <span class="menu__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="7" width="16" height="13" rx="3"/>
            <path d="M12 3v4"/>
            <circle cx="12" cy="3" r="1" fill="currentColor"/>
            <circle cx="9" cy="13" r="1.2" fill="currentColor"/>
            <circle cx="15" cy="13" r="1.2" fill="currentColor"/>
            <path d="M9 17h6"/>
          </svg>
        </span>
        <span class="menu__text"><b>vs Computer</b><em>1–3 AI opponents · 3 difficulties</em></span>
        <span class="menu__chev" aria-hidden="true">→</span>
      </button>
      <button class="menu__btn" data-mode="online-create">
        <span class="menu__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
          </svg>
        </span>
        <span class="menu__text"><b>Create Online Room</b><em>Free P2P · share a code</em></span>
        <span class="menu__chev" aria-hidden="true">→</span>
      </button>
      <button class="menu__btn" data-mode="online-join">
        <span class="menu__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/>
            <path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/>
          </svg>
        </span>
        <span class="menu__text"><b>Join Online Room</b><em>Enter a 6-character code</em></span>
        <span class="menu__chev" aria-hidden="true">→</span>
      </button>
    </div>

    <div class="menu__foot">
      <button class="chip" id="btnStats" title="Statistics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Stats</span>
      </button>
      <button class="chip" id="btnHistory" title="Game history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
        <span>History</span>
      </button>
      <button class="chip" id="btnAchievements" title="Achievements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 4H5v2a3 3 0 0 0 3 3M16 4h3v2a3 3 0 0 1-3 3"/><path d="M10 14h4l-.5 3h-3z"/><path d="M8 20h8"/></svg>
        <span>Achievements</span>
      </button>
      <button class="chip" id="btnRules" title="How to play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10a4 4 0 0 1 4 4v12"/><path d="M4 4v14a2 2 0 0 0 2 2h12"/><path d="M8 9h6M8 13h4"/></svg>
        <span>Rules</span>
      </button>
      <button class="chip" id="btnTheme" title="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9c-4 0-9-3-9-9z"/></svg>
        <span>Theme</span>
      </button>
      <button class="chip" id="btnSound" title="Toggle sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8" class="sound-on-only"/><path d="M19 5a9 9 0 0 1 0 14" class="sound-on-only"/></svg>
        <span>Sound</span>
      </button>
    </div>
  </div>
  <p class="foot">v1.0 · keyboard: <kbd>Space</kbd> roll · <kbd>1-5</kbd> hold · <kbd>Enter</kbd> confirm</p>
</section>

<!-- ===== SETUP SCREEN ===== -->
<section class="screen screen--setup hidden" id="screenSetup">
  <div class="card">
    <button class="back" data-back>‹ Back</button>
    <h2 id="setupTitle">Local Play</h2>
    <div class="setup">
      <label class="field">
        <span>Number of players</span>
        <div class="counter" data-counter="players">
          <button class="counter__btn" data-step="-1">−</button>
          <output id="playerCount">2</output>
          <button class="counter__btn" data-step="1">+</button>
        </div>
      </label>
      <div id="playerList" class="players-setup"></div>
      <div id="aiSettings" class="hidden">
        <label class="field"><span>AI difficulty</span>
          <div class="seg" data-seg="difficulty">
            <button data-val="easy">Easy</button>
            <button data-val="medium" class="active">Medium</button>
            <button data-val="hard">Hard</button>
          </div>
        </label>
      </div>
      <div id="onlineCreate" class="hidden online-box">
        <label class="field"><span>Your name</span>
          <input type="text" id="hostNameInput" maxlength="14" placeholder="Host" />
        </label>
        <p>Your room code:</p>
        <div class="room-code" id="roomCodeDisplay">······</div>
        <div class="online-actions">
          <button class="btn ghost" id="btnCopyCode">📋 Copy code</button>
          <button class="btn ghost" id="btnShareLink">🔗 Share link</button>
        </div>
        <p class="status" id="onlineStatus">Initializing…</p>
        <p class="hint">Share the code or link with friends. They open the same game URL and tap <b>Join Online Room</b>.</p>
        <ul class="lobby" id="lobbyList"></ul>
      </div>
      <div id="onlineJoin" class="hidden online-box">
        <label class="field"><span>Your name</span>
          <input type="text" id="joinNameInput" maxlength="14" placeholder="Player" />
        </label>
        <label class="field"><span>Room code</span>
          <input type="text" id="joinCodeInput" maxlength="6" placeholder="ABC123" autocapitalize="characters" inputmode="text" autocomplete="off" />
        </label>
        <button class="btn primary big" id="btnDoJoin">Join Room</button>
        <p class="status" id="joinStatus"></p>
      </div>
      <button class="btn primary big" id="btnStartGame">Start Game</button>
    </div>
  </div>
</section>

<!-- ===== GAME SCREEN ===== -->
<section class="screen screen--game hidden" id="screenGame">
  <header class="topbar">
    <button class="icon" id="btnMenu" aria-label="Menu">☰</button>
    <div class="turn-info">
      <span class="turn-info__round">Round <b id="roundNum">1</b>/13</span>
      <span class="turn-info__active" id="activeTurn">— rolling —</span>
    </div>
    <button class="icon" id="btnUndo" aria-label="Undo turn" title="Undo last turn">↶</button>
  </header>

  <div class="players-rail" id="playersRail"></div>

  <div class="game-grid">
    <div class="play-area">
      <div class="dice-tray" id="diceTray" role="group" aria-label="Dice"></div>
      <div class="rolls-left" id="rollsLeft">3 rolls left</div>
      <div class="actions">
        <button class="btn primary big" id="btnRoll">🎲 Roll</button>
        <button class="btn success big hidden" id="btnConfirm">✓ Confirm Score</button>
      </div>
    </div>

    <section class="scoresheet" id="scoresheet" aria-label="Scoresheet"></section>
  </div>
</section>

<!-- ===== MODALS ===== -->
<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="modal__panel">
    <button class="modal__close" data-modal-close aria-label="Close">×</button>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<!-- ===== CONFETTI ===== -->
<canvas id="confetti" class="confetti hidden"></canvas>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
